<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Paper grain: fine speckled noise, used as a multiply overlay on covers, pages and tape -->
  <filter id="g" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.32  0 0 0 0 0.05  0 0 0 0 0.05  0 0 0 -0.75 0.42"/>
  </filter>
  <rect width="240" height="240" filter="url(#g)"/>
</svg>
